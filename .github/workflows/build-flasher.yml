name: Build FunkFlash-ESP

on:
  push:
    branches: [main]
    paths: ["flasher/**", ".github/workflows/build-flasher.yml"]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r flasher/requirements.txt pyinstaller

      - name: Download latest firmware
        run: python flasher/fetch_firmware.py

      - name: Build exe
        shell: cmd
        run: |
          cd flasher
          pyinstaller ^
            --onefile --windowed --name FunkFlash-ESP ^
            --hidden-import esptool ^
            --hidden-import esptool.targets ^
            --hidden-import esptool.targets.esp32 ^
            --hidden-import esptool.loader ^
            --hidden-import esptool.cmds ^
            --hidden-import serial ^
            --hidden-import serial.tools ^
            --hidden-import serial.tools.list_ports ^
            --hidden-import serial.tools.list_ports_windows ^
            --collect-all esptool ^
            --add-data "firmware;firmware" ^
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: FunkFlash-ESP-Windows
          path: flasher/dist/FunkFlash-ESP.exe
          retention-days: 7

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: flasher/dist/FunkFlash-ESP.exe
